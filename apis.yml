name: Dealflo
description: 'Dealflo was a UK-based financial-technology company that provided an automated agreement,
  identity-verification, and e-signature platform used by lenders and financial institutions to capture,
  verify, and legally bind financial agreements end to end. It was acquired by OneSpan (formerly VASCO Data
  Security) in September 2018 for roughly USD 55 million and folded into OneSpan''s Digital Agreements /
  electronic-signature product line. The dealflo.com domain now 301-redirects to onespan.com and Dealflo no
  longer operates an independent developer program, public documentation, or API. This record is retained in
  the API Evangelist network as a portfolio/company lead surfaced from the HV Capital portfolio; no
  independent API artifacts exist to enrich because the product surface has been absorbed by OneSpan.'
